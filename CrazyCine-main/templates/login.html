{% extends 'base.html' %}
{% block content %}
<div class="container">
    <div class="card auth-card p-4">
        <h2 class="text-center fw-bold mb-4">Entrar</h2>
        <form method="post">
            <div class="mb-3"><label class="form-label">E-mail</label><input type="email" name="email" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Senha</label><input type="password" name="password" class="form-control" required></div>
            <button class="btn btn-gradient w-100">Entrar</button>
        </form>
        <p class="text-center mt-3">Não tem conta? <a href="{{ url_for('register') }}">Cadastre-se</a></p>
    </div>
</div>
{% endblock %}
